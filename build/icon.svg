<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- KeptaMark (src/components/KeptaMark.tsx) auf der Apple-Big-Sur-Icon-Grid:
       Kachel 824x824 bei (100,100). Alles hier ist die Komponente, mit demselben
       Faktor 25,75 hochskaliert — auch die Rundung: 7 von 32 = 0,21875, hier
       180,25 von 824. Vorher stand da 185,4 (0,225), also ein zweiter Wert,
       während die Komponente noch 9 trug. -->
  <rect x="100" y="100" width="824" height="824" rx="180.25" fill="#0f0f0f"/>
  <path d="M383.25 344.6 V679.4 M383.25 512 L568.65 344.6 M383.25 512 L568.65 679.4" stroke="white" stroke-width="48.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="645.9" cy="352.35" r="43.8" fill="white"/>
