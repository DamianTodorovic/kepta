[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kepta"
version = "0.1.1"
description = "Python-Client für KEPTA — das lokale Gedächtnis für KI-Agenten. Ohne Cloud, ohne Konto."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KEPTA", email = "hello@kepta.app" }]
keywords = ["memory", "ai", "agents", "mcp", "local-first", "privacy", "knowledge-graph", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Bewusst ohne Abhängigkeiten: nur die Standardbibliothek. Ein Gedächtnis, das
# Privatsphäre verspricht, sollte keinen fremden Code in deinen Prozess holen.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/DamianTodorovic/kepta"
Repository = "https://github.com/DamianTodorovic/kepta"
Issues = "https://github.com/DamianTodorovic/kepta/issues"
Changelog = "https://github.com/DamianTodorovic/kepta/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kepta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
