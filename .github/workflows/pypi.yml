name: PyPI

# Veroeffentlicht python/ auf PyPI — ohne Token.
#
# PyPI Trusted Publishing vertraut diesem Repository ueber OIDC. Es gibt kein
# Geheimnis, das gestohlen, geloggt oder versehentlich weitergegeben werden
# koennte: GitHub stellt ein kurzlebiges Zertifikat aus, PyPI prueft es.
#
# Einmalige Einrichtung auf pypi.org -> Your projects -> Publishing ->
# "Add a new pending publisher":
#   PyPI Project Name: kepta
#   Owner:             DamianTodorovic
#   Repository name:   kepta
#   Workflow name:     pypi.yml
#   Environment name:  pypi
#
# Danach genuegt ein Tag:  git tag py-v0.1.0 && git push origin py-v0.1.0

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install --upgrade build twine pytest

      # Nicht veroeffentlichen, was nicht getestet ist.
      - name: Tests
        working-directory: python
        run: python -m pytest -q

      - name: Paket bauen
        working-directory: python
        run: python -m build

      - name: Paket pruefen
        working-directory: python
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Erlaubt das OIDC-Zertifikat. Ohne diese Zeile schlaegt der Upload fehl.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Auf PyPI veroeffentlichen
        uses: pypa/gh-action-pypi-publish@release/v1
        # Kein `password:` — die Anmeldung laeuft ueber Trusted Publishing.
