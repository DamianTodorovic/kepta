name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests + Coverage (Gate)
        run: npm run test:cov
      - name: Retrieval-Eval (Hit@1)
        run: npm run eval
      - name: Coverage-Zusammenfassung (Job-Summary)
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const c = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${c[k].pct}% |`;
              const md = [
                "## 🧪 Test-Coverage",
                "",
                "| Metrik | Abdeckung |",
                "|---|---|",
                row("statements"), row("branches"), row("functions"), row("lines"),
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
            '
          else
            echo "Kein coverage-summary.json (json-summary Reporter aktiv?)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
      - name: Audit (high severity)
        run: npm audit --audit-level=high || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-test-build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    # Ohne Entwickler-Zertifikat: Signatur-Erkennung explizit aus — der Runner
    # bricht sonst evtl. an der Keychain-Suche ab (lokal wird sauber übersprungen).
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Kein `|| true`: ein fehlgeschlagener electron-builder-Build muss die CI rot machen.
      # 2 Versuche gegen flüchtige Netzfehler (Electron-/Binär-Downloads); bei
      # Endgültig-Fehler gehen die letzten Logzeilen als ::error::-Annotationen
      # in die Job-Zusammenfassung — öffentlich lesbar für die Diagnose.
      - name: macOS-Build (electron-builder, 2 Versuche)
        run: |
          set -o pipefail
          ok=0
          for i in 1 2; do
            echo "=== build:mac Versuch $i ==="
            if npm run build:mac -- --publish never 2>&1 | tee build-mac.log; then ok=1; break; fi
            echo "Versuch $i fehlgeschlagen."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Build endgültig fehlgeschlagen — letzte 60 Zeilen als Annotationen:"
            tail -60 build-mac.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi
      - name: Artefakte prüfen
        run: ls -la release/
      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          # Ohne Apple-Zertifikat sind die Builds unsigniert — ohne diesen Hinweis
          # scheitert jeder Nutzer beim Doppelklick an der Gatekeeper-Quarantäne.
          body: |
            ## 🍎 Erster Start unter macOS

            Diese Builds sind **nicht signiert und nicht notarisiert** (kein Apple-Entwicklerzertifikat).
            macOS setzt heruntergeladene Dateien in Quarantäne und meldet beim Doppelklick
            „kann nicht geöffnet werden, da der Entwickler nicht verifiziert werden kann".
            Die App ist in Ordnung — es fehlt nur die Signatur.

            Einmalig freigeben, danach startet sie normal:

            1. **Rechtsklick** auf `KEPTA.app` → **Öffnen** → im Dialog erneut **Öffnen**
            2. Alternativ: *Systemeinstellungen → Datenschutz & Sicherheit* → **Dennoch öffnen**

            Oder im Terminal:

            ```bash
            xattr -dr com.apple.quarantine /Applications/KEPTA.app
            ```

            Selbst bauen: `npm install && npm run build:mac` erzeugt DMG und ZIP unter `release/`.

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
