name: Publish

# Ein Tag, alles draussen: npm-Paket und Eintrag in der offiziellen MCP-Registry.
# Beides ueber OIDC, ohne Token und ohne Bestaetigungsklicks.
#
# Die Desktop-Artefakte baut build.yml, ebenfalls auf v*-Tags — die beiden
# Workflows laufen unabhaengig nebeneinander.
#
# EINMALIGE EINRICHTUNG auf npmjs.com (sonst scheitert der npm-Schritt):
#   Paket kepta-mcp -> Settings -> Trusted Publisher
#     Organization/User: DamianTodorovic
#     Repository:        kepta
#     Workflow filename: publish.yml      <-- genau diese Datei
#     Environment:       npm
# Fuer die MCP-Registry ist nichts einzurichten: sie vertraut dem OIDC-Zertifikat
# von GitHub, weil der Namensraum io.github.DamianTodorovic diesem Konto gehoert.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      modus:
        description: "'test' = nur OIDC-Exchange prüfen, nichts veröffentlichen"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Erlaubt das OIDC-Zertifikat. Ohne diese Zeile scheitern beide Uploads.
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Abhaengigkeiten
        if: github.event.inputs.modus != 'test'
        run: npm ci

      # Ein Tag, der nicht zur Version im Repo passt, veroeffentlicht sonst still
      # die falsche Fassung. Lieber hier abbrechen als in der Registry aufraeumen.
      - name: Tag und Versionen muessen uebereinstimmen
        run: |
          # Nur bei Tag-Pushes pruefen; bei workflow_dispatch ist GITHUB_REF
          # ein Branch (refs/heads/main) und wuerde sonst Muell in TAG hintenlassen.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG=""
          fi
          APP=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./npm/package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          echo "Tag=$TAG app=$APP npm=$PKG server=$SRV serverPkg=$SRVPKG"
          if [ -n "$TAG" ] && [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG passt nicht zu package.json ($APP)"; exit 1
          fi
          for v in "$PKG" "$SRV" "$SRVPKG"; do
            if [ "$v" != "$APP" ]; then
              echo "::error::Versionen laufen auseinander: app=$APP, gefunden=$v"; exit 1
            fi
          done

      # Nur-OIDC-Test (workflow_dispatch mit modus=test): holt den Token und
      # fragt den Exchange-Endpunkt von npmjs.com — endet immer grün.
      - name: Nur-OIDC-Test
        if: github.event.inputs.modus == 'test'
        run: |
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          curl -s -o /tmp/exchange.json -w "Exchange: HTTP %{http_code}\n" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/kepta-mcp" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
            -d '{"data":{"audience":"npm:registry.npmjs.org"}}' || true
          node -e "
            const fs=require('fs');
            try{const d=JSON.parse(fs.readFileSync('/tmp/exchange.json','utf8'));
              console.log(d.token ? 'ERGEBNIS: Exchange ERTEILT Token — Konfiguration greift!' : 'ERGEBNIS: ' + JSON.stringify(d).slice(0,300));
            }catch(e){console.log('Antwort roh:', fs.readFileSync('/tmp/exchange.json','utf8').slice(0,300))}"

      # Nicht veroeffentlichen, was nicht getestet ist. Die Tests pruefen auch
      # server.json gegen das MCP-Schema und den mcpName-Besitznachweis.
      - name: Tests
        if: github.event.inputs.modus != 'test'
        run: npm test

      - name: npm-Paket bauen
        if: github.event.inputs.modus != 'test'
        run: npm run build:npm

      - name: Inhalt zeigen
        if: github.event.inputs.modus != 'test'
        working-directory: npm
        run: npm pack --dry-run

      # Trusted Publishing braucht eine npm-CLI, die OIDC spricht.
      - name: npm aktualisieren
        if: github.event.inputs.modus != 'test'
        run: npm install -g npm@latest

      - name: Auf npm veroeffentlichen
        if: github.event.inputs.modus != 'test'
        working-directory: npm
        env:
          # Ein Granular-Access-Token (npmjs.com -> Access Tokens, read-write,
          # nur kepta-mcp) als Repo-Secret NODE_AUTH_TOKEN schaltet den
          # zuverlaessigen Token-Weg frei — der Registry-Exchange fuer Trusted
          # Publishing blieb npm-seitig bei 404 "package not found", obwohl der
          # Eintrag gespeichert war (3 Tage verifiziert). Beide Wege bleiben drin:
          # Token da? Token-Weg. Sonst Trusted Publishing ueber OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -o pipefail
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publish-Modus: Granular-Access-Token (NODE_AUTH_TOKEN gesetzt)"
            # Fail fast mit klarer Ursache statt kryptischem 404 auf PUT und
            # 5 Minuten Verbreitungswartezeit (25.9.-Lektion: Tokens haben
            # ein Ablaufdatum — das muss HIER stehen, nicht erst im Warteschritt).
            if ! npm whoami > /dev/null 2>&1; then
              echo "::error::NODE_AUTH_TOKEN ist ungueltig oder abgelaufen — neuen Token auf npmjs.com erzeugen (Granular, read-write, nur kepta-mcp) und das Repo-Secret NODE_AUTH_TOKEN ersetzen. Dann diesen Workflow per workflow_dispatch erneut starten."
              exit 1
            fi
            npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log
          else
            # setup-node hinterlaesst ein .npmrc mit einem authToken-Platzhalter und
            # exportiert NODE_AUTH_TOKEN. Findet npm dort einen Token, versucht es
            # KEINE OIDC-Anmeldung mehr und schickt den Muell an die Registry (404).
            # Also: beide Spuren entfernen — und der --provenance-Flag triggert den
            # OIDC-Flow ueberhaupt erst (ohne ihn kommt ENEEDAUTH).
            rm -f "${NPM_CONFIG_USERCONFIG:?NPM_CONFIG_USERCONFIG fehlt}"
            unset NODE_AUTH_TOKEN
            npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log
            echo "Publish-Modus: Trusted Publishing (OIDC)"
          fi
          # Idempotenz: Bei Re-Runs (z. B. wenn nur der Registry-Schritt scheiterte)
          # ist die Version schon live — E409 ist dann Erfolg, kein Abbruch.
          if grep -qE "cannot publish over|You cannot publish over|E409" /tmp/npm-publish.log; then
            echo "Version ist bereits auf npm — E409 als Erfolg gewertet, es geht mit der Registry weiter."
          fi

      - name: OIDC-Debug bei Fehlschlag
        if: failure()
        run: |
          # npm schreibt den OIDC-Handschlag nur in die Debug-Logs — hier Zeilen
          # zu Exchange/Provenance, mit Geheimnis-Zeilen ausgefiltert.
          grep -iE "oidc|exchange|provenance|ENEEDAUTH" /home/runner/.npm/_logs/*.log 2>/dev/null \
            | grep -viE "authorization|bearer|\"token\"" | tail -50 || echo "keine Debug-Log-Zeilen gefunden"
        # Kein NODE_AUTH_TOKEN — die Anmeldung laeuft ueber Trusted Publishing.

      # Die Registry prueft den Besitz, indem sie das npm-Paket abruft und dessen
      # mcpName liest. Ist die neue Version dort noch nicht sichtbar, schlaegt sie
      # fehl — deshalb warten statt hoffen.
      - name: Auf npm-Verbreitung warten
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          for i in $(seq 1 30); do
            LATEST=$(curl -sf "https://registry.npmjs.org/kepta-mcp" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'].latest" 2>/dev/null || echo "")
            echo "Versuch $i: npm meldet '$LATEST', erwartet '$VERSION'"
            [ "$LATEST" = "$VERSION" ] && exit 0
            sleep 10
          done
          echo "::error::kepta-mcp@$VERSION ist nach 5 Minuten nicht auf npm sichtbar"; exit 1

      - name: mcp-publisher holen
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: An der MCP-Registry anmelden
        run: |
          # Transiente TLS-Timeouts der Registry (24.9.) — dreimal versuchen.
          ok=""
          for versuch in 1 2 3; do
            if ./mcp-publisher login github-oidc; then ok=1; break; fi
            echo "Login-Versuch $versuch fehlgeschlagen — 10 s Pause, dann nochmal."
            sleep 10
          done
          [ -n "$ok" ] || exit 1

      - name: In die MCP-Registry eintragen
        run: |
          # Schon registriert (z. B. nach einem Re-Run) ist kein Fehler.
          if ./mcp-publisher publish > /tmp/registry-publish.log 2>&1; then
            echo "Registry-Eintrag aktualisiert."
          else
            cat /tmp/registry-publish.log
            if grep -qiE "already|conflict|409" /tmp/registry-publish.log; then
              echo "Version bereits in der Registry — ok."
            else
              exit 1
            fi
          fi
