name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      # Messvorlauf, kein Urteil — bitte nicht als ueberfluessig loeschen.
      # vitest schreibt seinen JSON-Bericht erst am ENDE eines Laufs, ein Test in
      # diesem Lauf kann ihn also nicht lesen. Die Zahlenwache
      # (tests/doku-zahlen.test.ts) vergleicht die Testzahl in den READMEs gegen
      # diesen Bericht und verweigert den Vergleich, wenn er fehlt — auf einem
      # frischen Runner mit seinem ersten vollen Lauf waere sie sonst rot, ohne
      # dass ein Fehler im Code steckte. Dieser Lauf erzeugt den Bericht des
      # aktuellen Baums; sein Befund zaehlt nicht, Gate ist der naechste Schritt.
      # Gemessen auf diesem Rechner (10 Kerne): `npm test` 8-24 s, `test:cov` 11 s.
      - name: Messvorlauf (schreibt test-results/vitest.json, Befund zaehlt nicht)
        run: npm test || true
      - run: npm test
      - name: Coverage gate
        run: npm run test:cov
      # Zahlen-Belege: jede Messzahl in der Doku wird an ihrem eigenen Artefakt
      # gemessen (scripts/zahlen-belege.mjs). Am 12.10. gebaut, nachdem drei
      # Vorher-Zahlen in README und CHANGELOG etwas behauptet hatten, was das
      # zitierte Log nicht hergab, und seit 13.10. hier verdrahtet: eine Console,
      # die niemand abhoert, huetet nichts. Nach der Suite, vor dem Bau — die
      # Suite schreibt test-results/, und die Doku zitiert keine Laufprodukte.
      # Der Runner sieht dabei nur diesen Baum: keine Arbeitsmappe, keine
      # Nachbarbaeume. Ein Zitat, das nur auf einem Schreibtisch existiert, ist
      # hier ein Befund — genau das ist der Punkt.
      - name: Zahlen-Belege (jede Zahl in der Doku trifft ihr zitiertes Artefakt)
        run: node scripts/zahlen-belege.mjs
      - run: npm run build
      # Der Python-Client ist ein verteiltes Artefakt (PyPI) — seine Tests
      # (Stub-Server, keine Live-App nötig) liefen bis 26.9. nirgends. Jetzt
      # hüten sie dieselbe CI wie den Rest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Client-Tests
        run: |
          pip install -e ./python
          pip install pytest
          pytest python/tests -q
