name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Coverage gate
        run: npm run test:cov
      - run: npm run build
      # Der Python-Client ist ein verteiltes Artefakt (PyPI) — seine Tests
      # (Stub-Server, keine Live-App nötig) liefen bis 26.9. nirgends. Jetzt
      # hüten sie dieselbe CI wie den Rest.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Client-Tests
        run: |
          pip install -e ./python
          pip install pytest
          pytest python/tests -q
