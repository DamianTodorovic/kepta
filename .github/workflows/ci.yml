name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Coverage gate
        run: npm run test:cov
      - run: npm run build
