name: npm

# Veroeffentlicht npm/ auf npmjs.com — ohne Token.
#
# npm Trusted Publishing vertraut diesem Repository ueber OIDC, genau wie
# pypi.yml es fuer PyPI tut. Es gibt kein Geheimnis, das gestohlen, geloggt
# oder versehentlich weitergegeben werden koennte.
#
# Einmalige Einrichtung — die erste Veroeffentlichung muss von Hand kommen,
# weil npm einen Trusted Publisher nur fuer ein existierendes Paket kennt:
#   1. npm login && npm run build:npm && cd npm && npm publish --access public
#   2. npmjs.com -> Paket kepta -> Settings -> Trusted Publisher:
#        Organization/User: DamianTodorovic
#        Repository:        kepta
#        Workflow filename: npm.yml
#        Environment:       npm
#
# Danach genuegt ein Tag:  git tag npm-v2.6.3 && git push origin npm-v2.6.3

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Erlaubt das OIDC-Zertifikat. Ohne diese Zeile schlaegt der Upload fehl.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Abhaengigkeiten
        run: npm ci

      # Nicht veroeffentlichen, was nicht getestet ist. Die npm-Tests bauen das
      # Bundle und pruefen Shebang, Syntax und Abhaengigkeitsfreiheit.
      - name: Tests
        run: npm test

      - name: Paket bauen
        run: npm run build:npm

      - name: Inhalt zeigen
        working-directory: npm
        run: npm pack --dry-run

      # Trusted Publishing braucht eine npm-CLI, die OIDC spricht.
      - name: npm aktualisieren
        run: npm install -g npm@latest

      - name: Auf npm veroeffentlichen
        working-directory: npm
        run: npm publish --access public
        # Kein NODE_AUTH_TOKEN — die Anmeldung laeuft ueber Trusted Publishing.
